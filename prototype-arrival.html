<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אב-טיפוס — ההגעה | SHIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#18163B; --navy-deep:#121234; --sky:#5CBBF0;
  --sky-a35:rgba(92,187,240,.35); --pill:999px;
  --ui:#0B0B1E; --line:rgba(255,255,255,.13);
  /* נשלטים מהסרגל */
  --light:0.62;   /* 0 = הווילון אטום (כמו היום) · 1 = פתוח לגמרי */
  --alive:0.85;   /* צפיפות השכבה החיה */
  --pop:0.70;     /* כמה הטקסט "נדחף" קדימה מול האור */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Assistant',system-ui,sans-serif;background:var(--ui);color:#fff;overflow:hidden}

/* ── סרגל ─────────────────────────────────── */
.bar{position:fixed;top:0;inset-inline:0;z-index:90;display:flex;gap:14px;align-items:center;
  flex-wrap:wrap;padding:11px 18px;background:rgba(8,8,22,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.bar b{font-size:.75rem;color:rgba(255,255,255,.45);font-weight:400;letter-spacing:.07em}
.chip{padding:7px 15px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;
  color:rgba(255,255,255,.72);font:inherit;font-size:.85rem;cursor:pointer;transition:.25s}
.chip:hover{border-color:rgba(255,255,255,.34);color:#fff}
.chip.on{background:var(--sky);border-color:var(--sky);color:var(--navy-deep);font-weight:600}
.sl{display:flex;align-items:center;gap:8px;font-size:.78rem;color:rgba(255,255,255,.6)}
.sl input{width:120px;accent-color:var(--sky)}
.sl output{min-width:30px;color:var(--sky);font-weight:600;font-size:.8rem}
.bar .right{margin-inline-start:auto;font-size:.74rem;color:rgba(255,255,255,.34)}

/* ── הבמה ─────────────────────────────────── */
.stage{position:fixed;inset:52px 0 0;overflow:hidden;background:var(--navy-deep)}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* הווילון — פחות אטום = יותר אור */
.curtain{position:absolute;inset:0;background:var(--navy-deep);opacity:.96;transition:opacity .5s ease}
body.better .curtain{opacity:calc(0.92 - var(--light) * 0.55)}

/* 🫁 הזוהר הנושם — הליבה */
.bloom,.bloom2{position:absolute;inset:-15%;opacity:0;pointer-events:none;mix-blend-mode:screen}
.bloom{background:radial-gradient(ellipse 50% 40% at 50% 56%,
  rgba(150,215,255,calc(.30 + var(--light) * .40)), transparent 68%)}
.bloom2{background:radial-gradient(ellipse 78% 62% at 50% 62%,
  rgba(92,187,240,calc(.14 + var(--light) * .26)), transparent 72%)}
body.better .bloom { opacity:1; animation:breathe 8.7s ease-in-out infinite }
body.better .bloom2{ opacity:1; animation:breathe 8.7s ease-in-out infinite reverse }
@keyframes breathe{
  0%   {transform:scale(1);    opacity:.5}
  34%  {transform:scale(1.13); opacity:1}
  44%  {transform:scale(1.15); opacity:1}
  100% {transform:scale(1);    opacity:.5}
}

/* קרן אור רכה מלמעלה */
.shaft{position:absolute;inset:0;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(178deg, rgba(160,220,255,.22) 0%, transparent 46%)}
body.better .shaft{opacity:calc(var(--light) * .9)}

/* 🧬 השכבה החיה — קנבס */
.field{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
body.better .field{opacity:1}

/* 🌑 סקרים — הילת עומק רכה מאחורי הטקסט בלבד.
   דוחפת את האור אחורה מקומית במקום להחשיך את כל הסצנה.
   זו הטכניקה של כותרות בקולנוע: הטקסט לא מוארך, הרקע נסוג. */
.scrim{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(ellipse 44% 38% at 50% 50%,
    rgba(6,12,32,calc(.58 * var(--pop))), transparent 72%)}
body.better .scrim{opacity:1}

/* ── תוכן ההגעה ──────────────────────────── */
.arrival{position:absolute;inset:0;display:grid;place-items:center;padding:0 24px;z-index:6}
.arrival-in{text-align:center;max-width:780px}
.a-logo{width:min(230px,46vw);margin:0 auto clamp(22px,4vh,40px);display:block;
  filter:drop-shadow(0 0 50px var(--sky-a35))}
/* הלוגו — הכי בולט: צל צמוד לקצה + הילה כהה רחבה + זוהר תכלת */
body.better .a-logo{
  filter:
    drop-shadow(0 2px 9px  rgba(6,12,32,calc(.62 * var(--pop))))
    drop-shadow(0 0 42px   rgba(6,12,32,calc(.52 * var(--pop))))
    drop-shadow(0 0 calc(30px + var(--light)*62px) rgba(150,215,255,.5));
}
.arrival h1{font-size:clamp(2.6rem,9vw,5.6rem);font-weight:200;line-height:1.06;
  letter-spacing:-.02em;color:#fff;text-wrap:balance}
.arrival h1 b{font-weight:400;color:var(--sky)}
/* הכותרת — בעוצמה של הלוגו. שלוש שכבות: חדות בקצה, הפרדה, ועומק */
body.better .arrival h1{
  text-shadow:
    0 2px 13px rgba(6,12,32,calc(.64 * var(--pop))),
    0 0 44px   rgba(6,12,32,calc(.52 * var(--pop))),
    0 0 96px   rgba(6,12,32,calc(.34 * var(--pop)));
}
.a-sub{margin:22px auto 0;max-width:60ch;font-size:clamp(1rem,2.2vw,1.18rem);font-weight:300;
  line-height:1.75;color:rgba(255,255,255,.9);text-wrap:pretty}
/* הפסקה — אותה שפה, כ-40% מהעוצמה. נקראת, לא צועקת. */
body.better .a-sub{
  color:rgba(255,255,255,.86);
  text-shadow:
    0 1px 7px  rgba(6,12,32,calc(.34 * var(--pop))),
    0 0 26px   rgba(6,12,32,calc(.22 * var(--pop)));
}
.a-ctas{margin-top:32px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{padding:15px 34px;border-radius:var(--pill);font:inherit;font-size:1rem;text-decoration:none;
  cursor:pointer;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s}
.btn-p{background:var(--sky);color:var(--navy-deep);font-weight:600}
body.better .btn-p{box-shadow:0 0 calc(var(--light)*46px) rgba(92,187,240,.5)}
.btn-g{border:1px solid rgba(255,255,255,.5);color:#fff}
.btn:hover{transform:translateY(-2px)}

/* ── הופעה: היום — הכל יחד ────────────────── */
.a-logo,.arrival h1,.a-sub,.a-ctas{opacity:0}
body.playing .a-logo,body.playing .arrival h1,
body.playing .a-sub,body.playing .a-ctas{animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}

/* ── הופעה: מוצע — מדורגת עם פעימת דממה ──── */
body.better.playing .a-logo   {animation:riseIn 1.1s cubic-bezier(.22,1,.36,1) forwards}
body.better.playing .arrival h1{animation:condense 1.5s cubic-bezier(.22,1,.36,1) .45s forwards}
body.better.playing .a-sub    {animation:riseIn 1.1s cubic-bezier(.22,1,.36,1) 2.5s forwards}
body.better.playing .a-ctas   {animation:riseIn 1.0s cubic-bezier(.22,1,.36,1) 3.35s forwards}
@keyframes condense{from{opacity:0;filter:blur(16px);transform:scale(1.045)}
                    to{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.timeline{position:fixed;bottom:0;inset-inline:0;z-index:90;padding:9px 18px 12px;
  background:linear-gradient(to top,rgba(8,8,22,.94),transparent);
  font-size:.73rem;color:rgba(255,255,255,.5);display:flex;gap:18px;flex-wrap:wrap}
.timeline i{font-style:normal;color:var(--sky)}

@media (prefers-reduced-motion:reduce){
  body.better .bloom,body.better .bloom2{animation:none;opacity:.75}
  .field{display:none}
  .a-logo,.arrival h1,.a-sub,.a-ctas{opacity:1!important;animation:none!important;
    filter:none!important;transform:none!important}
}
</style>
</head>
<body class="playing">

<div class="bar">
  <b>ההגעה</b>
  <button class="chip on" id="btnNow">כמו היום</button>
  <button class="chip" id="btnBetter">מוצע</button>
  <button class="chip" id="btnReplay">▶ שוב</button>
  <label class="sl">אור <input type="range" id="slLight" min="0" max="100" value="62"><output id="oLight">62</output></label>
  <label class="sl">שכבה חיה <input type="range" id="slAlive" min="0" max="100" value="85"><output id="oAlive">85</output></label>
  <label class="sl">בליטת טקסט <input type="range" id="slPop" min="0" max="100" value="70"><output id="oPop">70</output></label>
  <span class="right">גרור עד שזה מרגיש נכון — ותגיד לי את שלושת המספרים</span>
</div>

<div class="stage" id="stage">
  <img class="frame" src="assets/brain-seq/d/f060.webp" alt="">
  <div class="curtain"></div>
  <div class="bloom2"></div>
  <div class="bloom"></div>
  <div class="shaft"></div>
  <canvas class="field" id="field"></canvas>
  <div class="scrim"></div>

  <div class="arrival">
    <div class="arrival-in">
      <img class="a-logo" src="assets/brand/logo-white.png" alt="" aria-hidden="true">
      <h1>מהישרדות <b>ליצירה</b></h1>
      <p class="a-sub">
        SHIFT הוא מסע מעשי מתגובתיות אוטומטית ודפוסים שליליים אל חיים
        של בחירה, יצירה וצמיחה דרך למידה על מערכות האדם, עקרונות
        מדעיים ופסיכולוגיים.
      </p>
      <div class="a-ctas">
        <a class="btn btn-p" href="#">מתחילים SHIFT</a>
        <a class="btn btn-g" href="#">איך זה עובד?</a>
      </div>
    </div>
  </div>
</div>

<div class="timeline" id="tl"></div>

<script>
const body = document.body, tl = document.getElementById('tl');
const root = document.documentElement.style;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ─────────────────────────────────────────────
   🧬 השכבה החיה — הרשת שנפתחה
   הנוירונים מהצלילה לא נעלמים: הם מתפזרים החוצה,
   מאטים, והקשרים ביניהם נמתחים ונחלשים. זו בדיוק
   התמונה של "הישרדות → יצירה": הצפוף שנפתח למרחב.
   ───────────────────────────────────────────── */
const cv = document.getElementById('field'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
let W, H, nodes = [], alive = 0.85, raf = null;

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = stage.offsetWidth; H = stage.offsetHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  seed();
}
function seed(){
  const count = Math.round(14 + alive * 46);
  nodes = [];
  for (let i = 0; i < count; i++){
    // מתחילים צפוף סביב המרכז — משם הם מתפזרים
    const a = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 1.7) * Math.min(W, H) * 0.42;
    nodes.push({
      x: W/2 + Math.cos(a) * r,
      y: H/2 + Math.sin(a) * r * 0.8,
      vx: Math.cos(a) * (0.06 + Math.random() * 0.10),   // סחיפה החוצה
      vy: Math.sin(a) * (0.05 + Math.random() * 0.08),
      r: 0.7 + Math.random() * 1.6,
      ph: Math.random() * Math.PI * 2                     // פאזת הבהוב
    });
  }
}
function tick(t){
  ctx.clearRect(0, 0, W, H);
  if (alive > 0.01){
    const LINK = 128 + alive * 40;
    for (let i = 0; i < nodes.length; i++){
      const n = nodes[i];
      n.x += n.vx; n.y += n.vy;
      // כשהם יוצאים מהמסגרת — נולדים מחדש קרוב למרכז (הרשת ממשיכה לחיות)
      if (n.x < -60 || n.x > W+60 || n.y < -60 || n.y > H+60){
        const a = Math.random() * Math.PI * 2, r = Math.random() * Math.min(W,H) * 0.12;
        n.x = W/2 + Math.cos(a)*r; n.y = H/2 + Math.sin(a)*r*0.8;
        n.vx = Math.cos(a) * (0.06 + Math.random()*0.10);
        n.vy = Math.sin(a) * (0.05 + Math.random()*0.08);
      }
    }
    // קשרים — דקים, נמתחים ונחלשים עם המרחק
    ctx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++){
      for (let j = i+1; j < nodes.length; j++){
        const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
        const d2 = dx*dx + dy*dy;
        if (d2 < LINK*LINK){
          const o = (1 - Math.sqrt(d2)/LINK) * 0.16 * alive;
          ctx.strokeStyle = 'rgba(168, 222, 255, ' + o.toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
        }
      }
    }
    // הנקודות — מהבהבות לאט, כמו סינפסות שעוד פעילות
    for (const n of nodes){
      const tw = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t/1400 + n.ph));
      ctx.fillStyle = 'rgba(200, 236, 255, ' + (tw * 0.7 * alive).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
    }
  }
  raf = requestAnimationFrame(tick);
}

/* ── בקרה ─────────────────────────────────── */
const TEXT = {
  now: `<span>הכל מופיע יחד תוך <i>0.6ש׳</i></span>
        <span>הווילון אטום <i>96%</i></span>
        <span>אין תנועה, אין שכבה חיה</span>`,
  better: `<span>לוגו <i>0ש׳</i></span>
           <span>כותרת <i>0.45ש׳</i> — מתעבה מטשטוש</span>
           <span><i>פעימת דממה 2ש׳</i></span>
           <span>פסקה <i>2.5ש׳</i></span>
           <span>כפתורים <i>3.35ש׳</i></span>
           <span>זוהר נושם <i>8.7ש׳</i></span>
           <span>🧬 הרשת מתפזרת החוצה — חיה תמיד</span>
           <span>🌑 סקרים + הילות: לוגו וכותרת <i>100%</i> · פסקה <i>~40%</i></span>`
};
function replay(){
  body.classList.remove('playing'); void body.offsetWidth; body.classList.add('playing');
}
function setMode(better){
  body.classList.toggle('better', better);
  btnNow.classList.toggle('on', !better);
  btnBetter.classList.toggle('on', better);
  tl.innerHTML = better ? TEXT.better : TEXT.now;
  replay();
}
btnNow.onclick = () => setMode(false);
btnBetter.onclick = () => setMode(true);
btnReplay.onclick = replay;

slLight.oninput = e => { oLight.value = e.target.value; root.setProperty('--light', e.target.value/100); };
slAlive.oninput = e => {
  oAlive.value = e.target.value; alive = e.target.value/100;
  root.setProperty('--alive', alive); seed();
};
slPop.oninput = e => { oPop.value = e.target.value; root.setProperty('--pop', e.target.value/100); };

root.setProperty('--light', 0.62);
root.setProperty('--pop', 0.70);
addEventListener('resize', resize, {passive:true});
resize();
if (!reduced) raf = requestAnimationFrame(tick);
setMode(false);
</script>
</body>
</html>
