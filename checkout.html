<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>רכישת כרטיס · SHIFT</title>
  <!-- דף רכישה. עדיין ללא מערכת סליקה — אין כאן איסוף אמיתי של פרטי אשראי.
       השדות מנוטרלים (disabled) בכוונה; יוחלפו בדף סליקה מאובטח (PCI) של ספק
       תשלומים חיצוני. אין לאסוף/לאחסן מספרי כרטיס באתר הזה. -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/brand/favicon.png">
  <link rel="stylesheet" href="css/fonts.css?v=20260809d">
  <style>
    :root{
      --navy:#18163B; --navy-deep:#121234; --sky:#5CBBF0;
      --white-soft:rgba(255,255,255,.82); --white-faint:rgba(255,255,255,.5);
      --pill:999px; --radius:22px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Assistant',-apple-system,sans-serif;
      background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
      color:#fff;min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:32px 20px;line-height:1.5;
    }
    .co{width:min(480px,100%);text-align:right}
    .co-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .co-back{color:var(--white-soft);text-decoration:none;font-size:.95rem}
    .co-back:hover{color:#fff}
    .co-logo{width:96px;height:auto;opacity:.95}
    .co-card{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      border-radius:var(--radius);
      padding:clamp(24px,5vw,36px);
    }
    .co-card h1{font-size:1.6rem;font-weight:600;margin-bottom:18px}
    .co-summary{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 16px;border-radius:14px;
      background:rgba(92,187,240,.1);border:1px solid rgba(92,187,240,.25);
      margin-bottom:22px;
    }
    .co-summary span{color:var(--white-soft)}
    .co-summary strong{color:var(--sky);white-space:nowrap}
    .co-notice{
      background:rgba(92,187,240,.12);
      border:1px solid rgba(92,187,240,.3);
      border-radius:14px;padding:16px;margin-bottom:22px;
      font-size:.95rem;color:var(--white-soft);
    }
    .co-notice strong{display:block;color:#fff;margin-bottom:4px}
    .co-form{display:grid;gap:14px;opacity:.55;pointer-events:none}
    .co-form label{display:block;font-size:.9rem;font-weight:600;color:var(--white-soft)}
    .co-form input{
      width:100%;margin-top:6px;padding:12px 16px;border-radius:14px;
      border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
      color:#fff;font-family:inherit;font-size:1rem;
    }
    .co-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .co-pay{
      width:100%;margin-top:4px;padding:14px;border:0;border-radius:var(--pill);
      background:var(--sky);color:var(--navy-deep);font-family:inherit;
      font-size:1rem;font-weight:600;
    }
    .co-alt{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    .co-alt a{
      flex:1;text-align:center;text-decoration:none;
      padding:12px 18px;border-radius:var(--pill);
      border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:600;
      white-space:nowrap;
    }
    .co-alt a:hover{border-color:#fff;background:rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <main class="co">
    <div class="co-top">
      <a class="co-back" href="index.html" id="coBack">← חזרה לאתר</a>
      <img class="co-logo" src="assets/brand/logo-white.png" alt="SHIFT" width="1531" height="940">
    </div>

    <div class="co-card">
      <h1>רכישת כרטיס</h1>

      <div class="co-summary">
        <span>יום של SHIFT · כרטיס משתתף</span>
        <!-- TODO: מחיר מ-OC -->
        <strong>המחיר יעודכן</strong>
      </div>

      <div class="co-notice">
        <strong>התשלום המאובטח ייפתח כאן בקרוב.</strong>
        אנחנו מחברים מערכת סליקה מאובטחת. בינתיים אין להזין פרטי אשראי —
        השאירו פרטים או כתבו לנו בוואטסאפ, ונשלים איתכם את הרכישה.
      </div>

      <!-- הדגמה בלבד: השדות מנוטרלים ולא נאספים. יוחלפו בדף סליקה מאובטח. -->
      <form class="co-form" aria-hidden="true">
        <label>שם בעל הכרטיס
          <input type="text" disabled placeholder="בקרוב" autocomplete="off">
        </label>
        <label>מספר כרטיס
          <input type="text" disabled placeholder="•••• •••• •••• ••••" autocomplete="off">
        </label>
        <div class="co-row">
          <label>תוקף
            <input type="text" disabled placeholder="MM/YY" autocomplete="off">
          </label>
          <label>CVV
            <input type="text" disabled placeholder="•••" autocomplete="off">
          </label>
        </div>
        <button type="button" class="co-pay" disabled>לתשלום (בקרוב)</button>
      </form>

      <div class="co-alt">
        <a href="https://wa.me/972528972050?text=%D7%94%D7%99%D7%99%21%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A8%D7%9B%D7%95%D7%A9%20%D7%9B%D7%A8%D7%98%D7%99%D7%A1%20%D7%9C%D7%99%D7%95%D7%9D%20%D7%A9%D7%9C%20SHIFT%20%F0%9F%99%8F" target="_blank" rel="noopener">רכישה בוואטסאפ</a>
        <a href="index.html#contact">השארת פרטים</a>
      </div>
    </div>
  </main>
  <script>
    // חזרה לאתר בלי לאבד מיקום: אם הגענו מהאתר עצמו, history.back()
    // משחזר מ-bfcache את המסך המדויק (כולל מיקום הגלילה) במקום טעינה
    // מחדש מלמעלה. נפילה ל-href (index.html) אם נכנסו ישירות לדף.
    (function () {
      var back = document.getElementById('coBack');
      var fromSite = document.referrer &&
        (function () { try { return new URL(document.referrer).origin === location.origin; } catch (e) { return false; } })();
      if (back && fromSite) {
        back.addEventListener('click', function (e) { e.preventDefault(); history.back(); });
      }
    })();
  </script>
</body>
</html>
