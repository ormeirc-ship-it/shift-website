<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>‏SHIFT - העמוד לא נמצא</title>
  <meta name="robots" content="noindex">
  <!-- עמוד 404 של GitHub Pages מוגש מכל נתיב שגוי, כולל נתיבים מקוננים -
       לכן הוא עצמאי לגמרי: בלי CSS חיצוני, בלי JS, וקישור הבית אבסולוטי.
       ביום שיש דומיין: להחליף את /shift-website/ ב-/ (מרוכז ב-RUNBOOK). -->
  <link rel="icon" type="image/png" href="/shift-website/assets/brand/favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center;
      background: #18163B; color: #F6F5F2;
      font-family: 'Assistant', -apple-system, 'Segoe UI', system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    main { max-width: 420px; }
    img { width: min(150px, 36vw); height: auto; margin-bottom: 32px; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 600; margin-bottom: 12px; }
    p { font-weight: 300; line-height: 1.7; color: rgba(246, 245, 242, 0.78); margin-bottom: 32px; }
    a.home {
      display: inline-block; padding: 14px 34px; border-radius: 999px;
      background: #5CBBF0; color: #18163B; text-decoration: none;
      font-weight: 600; font-size: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a.home:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(92, 187, 240, 0.35); }
    a.home:focus-visible { outline: 2px solid #5CBBF0; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/shift-website/assets/brand/asset10.png" alt="" width="1551" height="1551">
    <h1>העמוד הזה עוד לא קיים</h1>
    <p>כמו מסלול עצבי - מה שלא נבנה עדיין, אפשר לבנות.<br>בינתיים, הדרך חזרה פתוחה.</p>
    <a class="home" href="/shift-website/">חזרה לעמוד הבית</a>
  </main>
</body>
</html>
