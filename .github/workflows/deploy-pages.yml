name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # לאוויר עולים רק קבצי הריצה של האתר. כלי הפיתוח, המסמכים, צילומי
      # ה-delivery, מקורות הרצף (_build) ו-node_modules נשארים בריפו בלבד.
      - name: Stage runtime files only
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude '_build' --exclude '_old-version' --exclude 'delivery' \
            --exclude 'scripts' --exclude 'tests' --exclude '*.md' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'prototype-*.html' \
            ./ /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'
      - id: deployment
        uses: actions/deploy-pages@v4
