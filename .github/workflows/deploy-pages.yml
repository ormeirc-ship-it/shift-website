name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # לאוויר עולים רק קבצי הריצה של האתר. כלי הפיתוח, המסמכים, צילומי
      # ה-delivery, מקורות הרצף (_build) ו-node_modules נשארים בריפו בלבד.
      - name: Stage runtime files only
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude '_build' --exclude '_old-version' --exclude 'delivery' \
            --exclude 'scripts' --exclude 'tests' --exclude '*.md' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'prototype-*.html' \
            --exclude '_deploy' --exclude 'firebase.json' --exclude '.firebaserc' \
            ./ /tmp/site/
      # ‏זמני (3.8): מקור-ה-Pages הוחלף בטעות ל-branch (build_type=legacy)
      # וכל push מריץ גם את הבנייה הישנה שמפרסמת את הריפו כולו - והיא
      # מסיימת אחרונה ומנצחת. עד שההגדרה תוחזר ל-"GitHub Actions"
      # (Settings→Pages, פעולת OC), אנחנו מחכים שהיא תסיים ואז פורסים
      # מעליה - מצב-יציב נקי, חשיפה של ~דקה בכל push בלבד.
      # להסיר את הצעד הזה כשה-build_type חוזר ל-workflow.
      - name: Wait out the legacy branch build (temporary)
        run: sleep 150
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'
      - id: deployment
        uses: actions/deploy-pages@v4
