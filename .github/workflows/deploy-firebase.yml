# פריסה ל-Firebase Hosting (T22, הכרעת OC 3.8) - מחליף את GitHub Pages
# כדי שהמאגר יוכל להיות פרטי בארגון shiftceos בלי שהאתר יירד.
#
# הופעל על push ב-14.9.2026 (T22 שלב 3): שני צעדי-OC הושלמו -
# פרויקט shift-il (→ shift-il.web.app) נכנס ל-.firebaserc, והסוד
# FIREBASE_SERVICE_ACCOUNT נשמר במאגר. workflow_dispatch נשאר זמין
# לפריסה ידנית בעת הצורך.
#
# שלב ה-rsync זהה אחד-לאחד ל-deploy-pages.yml - זו רשימת-ההחרגה
# שמונעת מה-HANDOFF, ה-BACKLOG, אבות-הטיפוס וכלי-הבדיקה לעלות לאוויר.
# צעד האימות בסוף מוודא זאת בפועל (404 על HANDOFF.md ועל אב-הטיפוס).
name: Deploy to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage runtime files only (parity with deploy-pages)
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' \
            --exclude '_build' --exclude '_old-version' --exclude 'delivery' \
            --exclude 'scripts' --exclude 'tests' --exclude '*.md' \
            --exclude 'package.json' --exclude 'package-lock.json' \
            --exclude 'prototype-*.html' \
            --exclude '_deploy' --exclude 'firebase.json' --exclude '.firebaserc' \
            --exclude 'perf' --exclude '_config.yml' \
            ./ _deploy/
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
      - name: Verify exclusion trap (docs must 404)
        # ‏JSON.parse ולא require: ‏.firebaserc חסר-סיומת, ו-require מקמפל
        # אותו כ-JS - ‏SyntaxError שהפיל את הצעד בשורה הראשונה בשתי הריצות
        # הראשונות (14.9), לפני שה-curl בכלל רץ. ה-retry×3 נשאר כהקשחה
        # מפני עיתוי-הפצה אמיתי בפריסות ראשונות.
        run: |
          SITE_URL="$(node -p "JSON.parse(require('fs').readFileSync('./.firebaserc','utf8')).projects.default + '.web.app'")"
          for p in HANDOFF.md prototype-arrival.html BACKLOG.md; do
            OK=""
            for i in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${SITE_URL}/${p}")
              echo "${p} (attempt ${i}): ${CODE}"
              [ "$CODE" = "404" ] && { OK=1; break; }
              sleep 15
            done
            [ -n "$OK" ] || { echo "::error::${p} is publicly served!"; exit 1; }
          done
